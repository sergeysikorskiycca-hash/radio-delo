<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт с нуля!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #2f3ab2; }
        button {
            background: #2f3ab2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #1e2786; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Привет, мир! 🚀</h1>
        <p>Этот сайт я делаю сам с нуля, без всяких конструкторов.</p>
        <button onclick="sayHello()">Нажми на меня</button>
    </div>

    <script>
        function sayHello() {
            alert('Ура! Всё работает! GitHub Pages запустил наш сайт!');
        }
    </script>

</body>
</html>
